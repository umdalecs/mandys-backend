# Api + database mode: brings up a PostgreSQL service alongside the api and
# points the api at it. The database persists in the `database-data` volume,
# so it doubles as the shared development database: you can also start it
# once on its own (`docker compose -f docker/compose.database.yml up -d database`
# from the repo root, or `docker compose -f compose.database.yml up -d database`
# from inside `docker/`)
# and then run the api alone (`docker compose -f docker/compose.yml up --build api`).
#
# Usage (from repo root):
#   docker compose -f docker/compose.yml -f docker/compose.database.yml up --build
# Usage (from inside docker/):
#   docker compose -f compose.yml -f compose.database.yml up --build
#
# Optional tools live behind the `tools` profile, so the flows above are
# unaffected. Start pgAdmin 4 (browser + ERD view of the same database) with:
#   docker compose -f docker/compose.database.yml --profile tools up -d pgadmin
# then open http://localhost:${PGADMIN_PORT:-5050} and log in with
# ${PGADMIN_EMAIL:-admin@mandys.com} / ${PGADMIN_PASSWORD:-postgres}. Register
# the server manually once: host `database`, port 5432, maintenance database
# ${POSTGRES_DB:-mandys}.

services:
  database:
    image: postgres:18
    ports:
      - ${DB_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mandys}
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mandys}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    ports:
      - ${PGADMIN_PORT:-5050}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mandyspos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-administrator}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy

  api:
    # Build is repeated from compose.yml so this file is also valid on its
    # own (e.g. `docker compose -f compose.database.yml up -d database`).
    image: mandys-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: final
    environment:
      ConnectionStrings__DefaultConnection: "User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Host=database;Port=5432;Database=${POSTGRES_DB:-mandys};"
    depends_on:
      database:
        condition: service_healthy

volumes:
  database-data:
  pgadmin-data:
