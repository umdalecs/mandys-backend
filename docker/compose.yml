services:
    database:
        image: postgres:18
        ports:
            - ${DB_PORT:-5432}:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-mandys}
        volumes:
            - database-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mandys}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    pgadmin:
        image: dpage/pgadmin4:latest
        ports:
            - ${PGADMIN_PORT:-5050}:80
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mandyspos.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-administrator}
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            database:
                condition: service_healthy

    storage:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - ${S3_PORT:-9000}:9000
            - ${S3_CONSOLE_PORT:-9001}:9001
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
        volumes:
            - storage-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    storage-init:
        image: minio/mc:latest
        depends_on:
            storage:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://storage:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin} &&
            mc mb --ignore-existing local/$${S3_BUCKET:-mandys} &&
            mc anonymous set download local/$${S3_BUCKET:-mandys}
            "

    api:
        image: mandys-backend
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: final
        ports:
            - ${API_PORT:-8080}:8080
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: "User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Host=${DB_HOST:-database};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-mandys};"
            S3__Endpoint: http://${S3_HOST:-storage}:9000
            S3__PublicUrl: ${S3_PUBLIC_URL:-http://localhost:9000}
            S3__AccessKey: ${S3_ACCESS_KEY:-minioadmin}
            S3__SecretKey: ${S3_SECRET_KEY:-minioadmin}
            S3__BucketName: ${S3_BUCKET:-mandys}
            S3__Region: ${S3_REGION:-us-east-1}
            S3__ForcePathStyle: "true"
            # Optional overrides for a separately hosted frontend (empty = defaults).
            Frontend__AllowedOrigins: ${FRONTEND_ORIGINS:-}
            Auth__CookieSameSite: ${COOKIE_SAMESITE:-}
            Auth__CookieSecure: ${COOKIE_SECURE:-}

volumes:
    database-data:
    pgadmin-data:
    storage-data:
