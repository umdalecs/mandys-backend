services:
    database:
        image: postgres:18.6
        ports:
            - ${DB_PORT:-5432}:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-mandys}
        volumes:
            - database-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mandys}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    pgadmin:
        image: dpage/pgadmin4:9.18.0
        ports:
            - ${PGADMIN_PORT:-5050}:80
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mandyspos.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-administrator}
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            database:
                condition: service_healthy

    storage:
        image: rustfs/rustfs:1.0.4
        ports:
            - ${S3_PORT:-9000}:9000
            - ${S3_CONSOLE_PORT:-9001}:9001
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
            RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
            RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
        volumes:
            - storage-data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    storage-init:
        image: amazon/aws-cli:2.39.1
        depends_on:
            storage:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
            AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
        entrypoint: >
            /bin/sh -c '
            BUCKET="$${S3_BUCKET:-mandys}";
            aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null ||
            aws --endpoint-url http://storage:9000 s3 mb "s3://$$BUCKET";
            aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadGetObject\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}"
            '

    api:
        image: mandys-backend
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: final
        ports:
            - ${API_PORT:-8080}:8080
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: "User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Host=${DB_HOST:-database};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-mandys};"
            S3__Endpoint: http://${S3_HOST:-storage}:9000
            S3__PublicUrl: ${S3_PUBLIC_URL:-http://localhost:9000}
            S3__AccessKey: ${S3_ACCESS_KEY:-rustfsadmin}
            S3__SecretKey: ${S3_SECRET_KEY:-rustfsadmin}
            S3__BucketName: ${S3_BUCKET:-mandys}
            S3__Region: ${S3_REGION:-us-east-1}
            S3__ForcePathStyle: "true"
            # Optional overrides for a separately hosted frontend (empty = defaults).
            Frontend__AllowedOrigins: ${FRONTEND_ORIGINS:-}
            Auth__CookieSameSite: ${COOKIE_SAMESITE:-}
            Auth__CookieSecure: ${COOKIE_SECURE:-}

volumes:
    database-data:
    pgadmin-data:
    storage-data:
